<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Comic Craft - Export Successful</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            color: #222;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 650px;

            background: white;

            padding: 45px;

            border-radius: 15px;

            text-align: center;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.15);
        }

        .success-icon {
            font-size: 70px;
            margin-bottom: 15px;
        }

        h1 {
            margin: 0 0 15px 0;
            color: #222;
        }

        .message {
            font-size: 18px;
            color: #555;
            line-height: 1.6;

            margin-bottom: 30px;
        }

        .file-name {
            background: #f0f0f0;

            padding: 15px;

            border-radius: 8px;

            margin-bottom: 30px;

            font-weight: bold;

            word-break: break-word;
        }

        .buttons {
            display: flex;

            justify-content: center;

            gap: 15px;

            flex-wrap: wrap;
        }

        .button {
            display: inline-block;

            padding: 12px 25px;

            border-radius: 8px;

            text-decoration: none;

            font-size: 16px;

            cursor: pointer;
        }

        .primary {
            background: #333;
            color: white;
        }

        .primary:hover {
            background: #555;
        }

        .secondary {
            background: #e5e5e5;
            color: #222;
        }

        .secondary:hover {
            background: #d5d5d5;
        }

    </style>

</head>


<body>

    <div class="container">

        <div class="success-icon">
            ✅
        </div>

        <h1>
            Comic Export Successful!
        </h1>

        <p class="message">
            Your comic has been successfully exported.
            You can now view or download your completed comic.
        </p>


        {% if filename %}

        <div class="file-name">

            📄 {{ filename }}

        </div>

        {% endif %}


        <div class="buttons">

            {% if download_url %}

            <a href="{{ download_url }}"
               class="button primary"
               download>
                ⬇️ Download Comic
            </a>

            {% endif %}


            {% if preview_url %}

            <a href="{{ preview_url }}"
               class="button primary">
                👀 View Comic
            </a>

            {% endif %}


            <a href="/"
               class="button secondary">
                ← Create Another Comic
            </a>

        </div>

    </div>

</body>

</html>
